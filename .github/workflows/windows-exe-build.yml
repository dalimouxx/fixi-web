name: FIXI Windows EXE build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/windows-pos/**'
      - '.github/workflows/windows-exe-build.yml'
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/windows-pos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/windows-pos/src-tauri -> target
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate FIXI Windows icon
        run: python scripts/generate_icon.py
      - name: Build Windows NSIS EXE
        env:
          # Adresse du serveur proposée à la connexion de la caisse (variable GitHub FIXI_PUBLIC_URL, ex. https://fixi.mon-domaine.tn)
          VITE_FIXI_SERVER: ${{ vars.FIXI_PUBLIC_URL }}
        run: npm run tauri build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FIXI-Caisse-Windows-Setup
          path: apps/windows-pos/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish update for FIXI Caisse (auto-update)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName FIXI-Caisse-Setup.exe
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sha = (Get-FileHash FIXI-Caisse-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/windows-latest/FIXI-Caisse-Setup.exe"
          @{ version = $version; url = $url; sha256 = $sha; notes = "Nouvelle version de FIXI Caisse." } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest.json
          gh release view windows-latest --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo ${{ github.repository }} --title "FIXI Caisse Windows (dernière version)" --notes "Installateur Windows et fichier de mise à jour automatique." --latest=false
          }
          gh release upload windows-latest FIXI-Caisse-Setup.exe latest.json --repo ${{ github.repository }} --clobber
