name: Fixi bootstrap test
on:
  push:
    paths:
      - ".github/workflows/fixi-bootstrap.yml"
permissions:
  contents: write
jobs:
  test-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow write permission
        run: |
          echo "workflow-ok" > .fixi-workflow-ok
          git config user.name "fixi-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .fixi-workflow-ok
          git commit -m "chore: verify GitHub Actions write" || exit 0
          git push
