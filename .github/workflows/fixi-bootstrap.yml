name: Install Fixi Web 10.1.1
on:
  push:
    paths:
      - ".github/workflows/fixi-bootstrap.yml"

permissions:
  contents: write

jobs:
  install-fixi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staged archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/payload.b64 > /tmp/fixi.zip
          echo "898e569ea63eef82d3ff17404789861b658a01d8a8cb052c2f6e1c9dabec71dc  /tmp/fixi.zip" | sha256sum -c -

      - name: Install final Fixi source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fixi-unpack
          mkdir -p /tmp/fixi-unpack
          unzip -q /tmp/fixi.zip -d /tmp/fixi-unpack
          SRC="/tmp/fixi-unpack/fixi_claude_v101"
          test -f "$SRC/package.json"
          test -f "$SRC/render.yaml"
          test -f "$SRC/Dockerfile"
          test -f "$SRC/prisma/schema.prisma"

          find . -mindepth 1 -maxdepth 1             ! -name .git             ! -name .github             ! -name .bootstrap             -exec rm -rf {} +

          cp -a "$SRC"/. .
          rm -rf .bootstrap
          rm -f .github-init .fixi-workflow-ok
          rm -f .github/workflows/fixi-bootstrap.yml

      - name: Commit Fixi Web 10.1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fixi Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fixi Web 10.1.1 - GitHub Render ready"
          git push
