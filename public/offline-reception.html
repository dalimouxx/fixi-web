<!doctype html><html lang="fr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>Fixi · Réception Offline</title><style>body{margin:0;font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;background:#111217;color:#fff}.wrap{max-width:720px;margin:auto;padding:28px 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:48px;height:48px;border-radius:16px;background:#ff6b00;display:grid;place-items:center;font-size:25px;font-weight:1000}.tag{color:#ff9a52;font-size:12px;font-weight:900;letter-spacing:.1em}.lang{margin-inline-start:auto;background:#242730;color:#fff;border:1px solid #383c48;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}.card{background:#1a1c22;border:1px solid #2a2d35;border-radius:24px;padding:22px;box-shadow:0 20px 50px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.full{grid-column:1/-1}label{font-size:12px;color:#aeb2bd;font-weight:800}input,select,textarea{font:inherit;color:#fff;background:#101116;border:1px solid #363a45;border-radius:14px;padding:14px;outline:0}input:focus,textarea:focus{border-color:#ff6b00}.btn{width:100%;margin-top:18px;border:0;border-radius:14px;background:#ff6b00;color:#fff;font-weight:1000;padding:16px;font-size:16px}.status{display:flex;gap:10px;align-items:center;margin:16px 0;padding:12px 14px;border-radius:14px;background:#20232b}.dot{width:9px;height:9px;border-radius:50%;background:#f33;flex:0 0 auto}.online .dot{background:#22c55e}.queue{color:#ffb37d}.safe{margin-top:16px;color:#aeb2bd;font-size:13px;line-height:1.6}[dir=rtl] .brand,[dir=rtl] .status{flex-direction:row-reverse}[dir=rtl] input,[dir=rtl] textarea,[dir=rtl] label{text-align:right}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="brand"><div class="logo">F</div><div><div class="tag">FIXI OFFLINE</div><h2 id="title" style="margin:2px 0">Réception d’urgence</h2></div><button id="lang" class="lang" type="button">العربية</button></div><div id="status" class="status"><span class="dot"></span><b id="statusText">Hors ligne</b><span id="queue" class="queue"></span></div><div class="card"><form id="f"><div class="grid"><div class="field"><label id="lPhone">Téléphone client *</label><input name="clientPhone" required inputmode="tel"></div><div class="field"><label id="lName">Nom client *</label><input name="clientName" required></div><div class="field"><label id="lBrand">Marque</label><input id="brand" name="brand" placeholder="Samsung"></div><div class="field"><label id="lModel">Modèle *</label><input id="model" name="model" required placeholder="Galaxy A15"></div><div class="field full"><label id="lIssue">Panne *</label><textarea id="issue" name="reportedIssue" required placeholder="Écran cassé"></textarea></div><div class="field"><label id="lPrice">Prix estimé</label><input name="estimatedPrice" type="number" step="0.001"></div><div class="field"><label id="lWarranty">Garantie (jours)</label><input name="warrantyDays" type="number" value="30"></div></div><button id="save" class="btn">Enregistrer dans Fixi Offline</button></form><div id="safe" class="safe">Les données restent sur cet appareil jusqu’à la synchronisation. Aucun paiement, remboursement ou mouvement de stock n’est exécuté depuis cette page.</div></div></div><script>
const KEY='fixi_offline_queue_v10',LANG='fixi_lang';let lang=localStorage.getItem(LANG)==='ar'?'ar':'fr';
const T={fr:{title:"Réception d’urgence",phone:"Téléphone client *",name:"Nom client *",brand:"Marque",model:"Modèle *",issue:"Panne *",price:"Prix estimé",warranty:"Garantie (jours)",save:"Enregistrer dans Fixi Offline",safe:"Les données restent sur cet appareil jusqu’à la synchronisation. Aucun paiement, remboursement ou mouvement de stock n’est exécuté depuis cette page.",off:"Hors ligne · les réceptions restent sur cet appareil",on:"Internet disponible · ouvrez Fixi pour synchroniser",pending:"en attente",ok:"Réception enregistrée localement. Elle sera synchronisée dans Fixi quand Internet reviendra.",toggle:"العربية",issuePh:"Écran cassé"},ar:{title:"استقبال طارئ دون إنترنت",phone:"هاتف الحريف *",name:"اسم الحريف *",brand:"العلامة",model:"الموديل *",issue:"العطل *",price:"السعر التقديري",warranty:"الضمان (بالأيام)",save:"حفظ الاستقبال دون إنترنت",safe:"تبقى البيانات محفوظة على هذا الجهاز إلى حين المزامنة. لا يتم تنفيذ أي دفع أو استرجاع أو حركة مخزون من هذه الصفحة.",off:"لا يوجد إنترنت · الاستقبالات محفوظة على هذا الجهاز",on:"الإنترنت متوفر · افتح Fixi للمزامنة",pending:"في الانتظار",ok:"تم حفظ الاستقبال محلياً وسيتم مزامنته مع Fixi عند عودة الإنترنت.",toggle:"FR",issuePh:"شاشة مكسورة"}};
function q(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function paint(){const x=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';for(const [id,k] of [['title','title'],['lPhone','phone'],['lName','name'],['lBrand','brand'],['lModel','model'],['lIssue','issue'],['lPrice','price'],['lWarranty','warranty'],['save','save'],['safe','safe']])document.getElementById(id).textContent=x[k];document.getElementById('lang').textContent=x.toggle;document.getElementById('issue').placeholder=x.issuePh;draw()}
function draw(){const online=navigator.onLine,x=T[lang],s=document.getElementById('status');s.className='status '+(online?'online':'');document.getElementById('statusText').textContent=online?x.on:x.off;document.getElementById('queue').textContent=q().length?` · ${q().length} ${x.pending}`:''}
document.getElementById('lang').onclick=()=>{lang=lang==='fr'?'ar':'fr';localStorage.setItem(LANG,lang);paint()};addEventListener('online',draw);addEventListener('offline',draw);paint();
document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const payload={...d,category:'PHONE',priority:'NORMAL',estimatedPrice:d.estimatedPrice?Number(d.estimatedPrice):null,finalPrice:null,warrantyDays:Number(d.warrantyDays||30),technicianId:'',clientEmail:'',serialNumber:'',color:'',lockCode:'',promisedAt:'',estimatedMinutes:null};const a=q();a.push({id:`offline_${Date.now()}_${Math.random().toString(36).slice(2,9)}`,type:'CREATE_REPAIR',payload,createdAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(a));e.target.reset();e.target.warrantyDays.value='30';draw();alert(T[lang].ok)};
</script></body></html>
