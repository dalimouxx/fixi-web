services:
  - type: web
    name: fixi-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start
    preDeployCommand: npx prisma db push && npm run db:seed
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: fixi-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: PLATFORM_AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: KONNECT_PLATFORM_WALLET_ID
        sync: false
      - key: KONNECT_PLATFORM_API_KEY
        sync: false
      - key: KONNECT_PLATFORM_SANDBOX
        value: "true"
      - key: SUPPLIER_AUTH_SECRET
        generateValue: true
      - key: FIXI_AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_URL
        value: https://api.anthropic.com/v1
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Alertes téléphone (Push). Générer une paire avec : npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Alertes WhatsApp « nouvelle commande » pour les fournisseurs (compte WhatsApp Business de la plateforme).
      # Le modèle de message doit être approuvé par Meta, avec 3 variables : boutique, référence, montant.
      - key: WHATSAPP_PLATFORM_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_PLATFORM_TOKEN
        sync: false
      - key: WHATSAPP_NEW_ORDER_TEMPLATE
        value: fixi_nouvelle_commande
      - key: WHATSAPP_TEMPLATE_LANG
        value: fr
      - key: VAPID_SUBJECT  # ex. mailto:votre-adresse@domaine.tn
        sync: false
      # Alertes techniques sur votre téléphone (erreurs, sauvegardes) : Telegram et/ou webhook (Discord, Slack…)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Mettre "on" une fois la sauvegarde nocturne GitHub configurée : alerte si aucune sauvegarde depuis 26 h.
      - key: BACKUP_EXPECTED
        value: "off"
      - key: DEFAULT_SHOP_SLUG
        value: atelier-principal
      - key: INITIAL_SHOP_SLUG
        value: atelier-principal
      - key: INITIAL_SHOP_NAME
        value: Mon Atelier
      - key: INITIAL_SHOP_REGION
        value: Gabès
      - key: INITIAL_ADMIN_LOGIN
        value: admin
      - key: INITIAL_ADMIN_PIN
        sync: false
      - key: PLATFORM_ADMIN_LOGIN
        value: platform
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

databases:
  - name: fixi-db
    plan: free
    region: frankfurt
    databaseName: fixi
    user: fixi
    postgresMajorVersion: "16"
